name: Fuel Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests

      - name: Check Telegram connection
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["BOT_TOKEN"]

          url = f"https://api.telegram.org/bot{token}/getMe"

          response = requests.get(url, timeout=30)

          print("Telegram HTTP status:", response.status_code)
          print("Telegram response:", response.text)

          response.raise_for_status()

          data = response.json()

          if not data.get("ok"):
              raise RuntimeError(f"Telegram API error: {data}")

          print("Telegram connection: OK")
          PY

      - name: Run monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python fuel_monitor.py
        
      - name: Test Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          response = requests.post(
              f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
              json={
                  "chat_id": os.environ["CHAT_ID"],
                  "text": "🧪 Тест: GitHub Actions → Telegram работает"
              },
              timeout=20
          )

          print(response.status_code)
          print(response.text)
          response.raise_for_status()
          PY
        
      - name: Save state
        run: |
          git config user.name "fuel-monitor"
          git config user.email "fuel-monitor@users.noreply.github.com"

          git add fuel_state.json

          if git diff --cached --quiet; then
            echo "State has not changed"
          else
            git commit -m "Update fuel state"
            git push
          fi
