name: Fuel Monitor

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python fuel_monitor.py

      - name: Save state
        run: |
          git config user.name "fuel-monitor"
          git config user.email "fuel-monitor@users.noreply.github.com"

          if git diff --quiet fuel_state.json; then
            echo "State has not changed"
          else
            git add fuel_state.json
            git commit -m "Update fuel state"
            git push
          fi
